// ===========================================================================
// A FIXTURE, copied verbatim from garm's `proto/garm/card/v1/card.proto` as
// Track G wrote it, and the thing garmd's card walk is tested against.
//
// garmd does NOT link `garm.card.v1`. It recognises the type by full name and
// reads `access` off the value through protoreflect, so the only thing that
// can go wrong is the shape assumed here drifting from the shape garm ships.
// This file is where the assumption is written down; `cards_test.go` holds it.
//
// The garm module this repository builds against (v0.14.2, and v0.16.0 the
// day it is bumped) does NOT carry `Label` or `access`: Track G adds them and
// tags v0.17.0. **When it lands, replace this file with the released one** —
// every test in cards_test.go must pass unchanged, and if one does not, the
// contract moved and the walk has to move with it. See KNOWN-GAPS.md.
// ===========================================================================
// The card vocabulary: what an inbox renders for one viewer at one moment,
// and the template an author may declare beside a tool or an agent.
//
// A new package rather than a field on garm.tool.v1, because garmd must stay
// card-blind: it projects a tool's typed request and response field by field
// and never reads a template. The extension numbers are outside the
// 50001-50005 block garm.tool.v1 owns and the 50101 garm.agent.v1 owns, so
// the vocabularies can never collide.
//
// Enum values are deliberately unprefixed (TASK, OPEN, SUBTLE) rather than
// buf's KIND_TASK convention: a card crosses the wire as protojson with enums
// as strings, and the JSON shape — "kind": "TASK" — is the contract with the
// renderer. buf.yaml excuses this file from those two rules for that reason.
syntax = "proto3";
package garm.card.v1;
option go_package = "github.com/garm-ai/garm/contracts/garm/card/v1;cardv1";

import "google/protobuf/descriptor.proto";
import "garm/tool/v1/tool.proto";

// Who may see one element of a card.
//
// Read by garmd, which knows this one type and drops what a viewer does not
// reach at step 8 (design 3). Set by the TOOL that serves the card: by the
// generated default from the source field's policy, or by an override.
//
// An absent label is NOT public. It means "the card endpoint's own policy",
// which is the parent tool's clearance and compartments -- so forgetting to
// label an element is as tight as the endpoint, never looser. An element
// labelled BELOW the endpoint's policy fails the whole card
// (500 card_invalid, design 3.2 floor 1).
message Label {
  garm.tool.v1.Clearance clearance    = 1;
  repeated string        compartments = 2;
}

// CallRef names a garmd call: the id every tool sees (callctx.FromContext),
// every ledger row carries, and the answer returns as Garm-Event-Id. It is
// the argument of a tool's ResultCard.
//
// For an agent the call is the Invoke, and the runner records the call id on
// the run row, so one id addresses a run and its card alike. RunRef stays for
// GetRun.
message CallRef {
  option (garm.tool.v1.default_field_policy) = { read: CLEARANCE_PUBLIC on_deny: { omit: {} } };
  optional string call_id = 1;
}

// TaskRef names one open task, and carries the material the viewer's client
// rebuilt from the task card.
//
// The material travels because of an ordering fact: garmd refuses a
// grant-mode call at step 5, before step 6 resolves the tool, so the tool
// NEVER SAW the request that was parked. Its approval card cannot show what
// it never received unless the fetch brings it (design 1.3).
//
// A lying map buys a wrong context beside the right material, never a wrong
// grant: the digest is computed from what the tasks tool stored, and garmd
// compares it with the request actually sent.
message TaskRef {
  option (garm.tool.v1.default_field_policy) = { read: CLEARANCE_PUBLIC on_deny: { omit: {} } };
  optional string task_id = 1;
  map<string, string> material = 2;   // dotted path -> canonical text
}

// A Card is an OPAQUE VALUE to the field-policy walk, and a structure only to
// the daemon's card walk.
//
// That is the one thing to know before reading the rest of this message. A
// field policy is per descriptor: it says what EVERY caller of this RPC may
// see of this field, decided at compile time. A card's rows do not work that
// way — a queue holds one task per approver, and the same `Fact` is readable
// by one viewer and not the next — so the policy travels on the VALUE, as the
// `access` label on each element. The daemon knows this one type and projects
// it by those labels after the field plan has run.
//
// So `garm.card.v1.Card` is an opaque leaf to policy.Compile and to lint, the
// way `google.protobuf.Timestamp` is: the field that HOLDS a card carries the
// policy for the whole value, and no scalar inside one is classified
// separately. A per-field policy in here would be a second mechanism
// answering the same question differently, which is how a leak gets written.
//
// A Card is a projection of one object — a task, a run, or an agent's
// input — rendered for ONE viewer at ONE moment. It is built by agentd or
// a tool handler, validated at render time (§7), and crosses the policy
// chain like any other response on the governed door.
message Card {
  Kind             kind       = 1;   // START | TASK | RUN
  string           subject_id = 2;   // agent name, task id, or run id
  string           title      = 3;
  State            state      = 4;   // see 1.2
  repeated Element body       = 5;
  repeated Action  actions    = 6;   // empty unless state == OPEN
  Disclosure       disclosure = 7;   // what was withheld from THIS viewer
  repeated CardRef refs       = 8;   // pointers to other cards, never copies
  string           catalogue_digest = 9;

  // The whole card. A viewer who does not reach it gets nothing: dropped
  // from a repeated field, NotFound as a unary answer (design 3.2 rule 1) --
  // the same closed answer step 2 gives for a tool they may not see.
  Label            access           = 10;
}

enum Kind  { KIND_UNSPECIFIED = 0; START = 1; TASK = 2; RUN = 3; ASK = 4; }
enum State { STATE_UNSPECIFIED = 0; OPEN = 1; ANSWERED = 2; EXPIRED = 3; RUNNING = 4; COMPLETED = 5; FAILED = 6; }

// A pointer to another card: a task card at its run, a run card at its tasks.
//
// `tool_fqn` is what makes a ref SELF-ADDRESSING, and it is the field that
// was missing. A kind and an id say which card; they do not say whose
// ResultCard or ApprovalCard to call for it, and a client that started a run
// itself knows the answer while a client that reached the same run from a
// task does not. Without it one page could not show itself. With it, any ref
// is enough to fetch the card it names — no second lookup, and no table of
// the client's own that would go stale the moment a tool moved service.
message CardRef {
  Kind   kind       = 1;
  string subject_id = 2;
  string title      = 3;
  State  state      = 4;
  string tool_fqn   = 5;   // the tool whose service serves the card this names
}

message Element {
  oneof of {
    Text    text    = 1;
    FactSet facts   = 2;
    Divider divider = 3;
    Input   input   = 4;
    Section section = 5;   // a titled group of elements; one level, never nested (1.3)
  }

  // Who may see this element. For a Section, the FLOOR of every element
  // inside it: a child may be labelled higher, never lower (lint C8).
  Label access = 10;
}

message Text    { string text = 1; Emphasis emphasis = 2; }
enum Emphasis   { DEFAULT = 0; HEADING = 1; SUBTLE = 2; }
message FactSet { repeated Fact facts = 1; }
// A fact is a caption, a value, and -- when the value came from a field of a
// governed message -- the dotted path it came from.
//
// `field` is what lets a client rebuild TaskRef.material from a task card's
// Material section (design 2.3), and what garmd names in Disclosure instead
// of a positional path when an element is withheld.
message Fact    { string label = 1; string value = 2; string field = 3; Label access = 4; }
message Divider {}
message Section { string title = 1; repeated Element elements = 2; }

message Input {
  string id       = 1;   // MUST name a field of the decision message (§3.4 C2)
  string label    = 2;
  bool   required = 3;
  oneof kind {
    TextInput   text   = 4;
    NumberInput number = 5;
    DateInput   date   = 6;
    ToggleInput toggle = 7;
    ChoiceInput choice = 8;
  }
}
message TextInput   { uint32 max_len = 1; bool multiline = 2; }
message NumberInput { double min = 1; double max = 2; }
message DateInput   {}
message ToggleInput {}
message ChoiceInput {
  repeated Choice choices = 1;   // a closed list, or
  Query           query   = 2;   // a governed lookup (§4)
  bool            multi   = 3;
}
message Choice { string title = 1; string value = 2; Label access = 3; }

// Executes as the VIEWER, bound to the task the card is about (§4).
message Query {
  string tool      = 1;   // fully-qualified tool name, in THIS contract, unary, VERB_READ
  uint32 min_chars = 2;
  uint32 page_size = 3;
}

message Action {
  string id    = 1;      // "approve" | "decline" for TASK; "start" for START
  string label = 2;
  Style  style = 3;
  oneof kind { Submit submit = 4; }
}
enum Style { STYLE_DEFAULT = 0; POSITIVE = 1; DESTRUCTIVE = 2; }
message Submit { string confirm_text = 1; }

// The viewer's copy of tools-server §5.5: which fields were withheld from
// them, by name, never by value.
message Disclosure { repeated string withheld_fields = 1; }

// Declared cards (design §3.2). A template is read by agentd from the
// catalogue generation a task or run pinned; garmd never reads it.
//
//   result_card  on an agent service: renders the run's result. Until agents
//                declare an output type, a result card may carry literal
//                text only — lint C1 refuses a {field} reference.
//   task_card    on a MODE_GRANT tool: adds context to the open task card.
//                A {field} reference names one of the tool's
//                approval.material_fields, and nothing else (lint C1).
//   card_role    on a query's response fields (§4). Declared here; nothing
//                reads it in this release.
extend google.protobuf.ServiceOptions { Template result_card = 50201; }   // on an agent service
extend google.protobuf.MethodOptions  { Template task_card   = 50202; }   // on a MODE_GRANT tool
extend google.protobuf.FieldOptions   { CardRole  card_role  = 50203; }   // on a query's response fields (§4)

message Template {
  string title = 1;                 // may reference fields: "Payment {reference}"
  repeated TemplateElement body = 2;
  string context = 3;               // optional: a context RPC in this package (§3.3); fields as context.<name>
}
message TemplateElement {
  oneof of {
    string  text    = 1;            // literal, with {field} references
    Facts   facts   = 2;            // fields by name, in this order, with labels
    Divider divider = 3;
    TemplateSection section = 4;
  }
}
message Facts { repeated FactRef facts = 1; }

// A declared fact, and optionally who may see it.
//
// `access` unset means the source field's own policy, which is what the
// generated default would have labelled it anyway — so an author only writes
// one when they want it TIGHTER. It can never usefully be looser: an element
// labelled below its card endpoint fails the whole card, and a child labelled
// below its Section is lint C8.
message FactRef { string field = 1; string label = 2; Label access = 3; }

// A titled group, and the FLOOR of everything inside it.
//
// A section is how a card says "this block is compliance's". Its label is a
// floor rather than a value: a child may be labelled higher — one fact inside
// a compliance section that only the head of compliance sees — and never
// lower, because a reader who cannot see the heading cannot be shown what was
// under it (lint C8).
message TemplateSection { string title = 1; repeated TemplateElement elements = 2; Label access = 3; }
enum CardRole { CARD_ROLE_UNSPECIFIED = 0; CARD_ROLE_TITLE = 1; CARD_ROLE_VALUE = 2; }
