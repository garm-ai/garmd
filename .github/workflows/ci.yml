# CI for garmd.
#
# Two jobs. The first is the ordinary one. The second asserts the boundaries
# this repository exists to hold — and they are asserted rather than
# documented because a single careless import would end either one silently.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: mise run lint
      - run: mise run build
      # -race because the plan cache is shared across concurrent requests by
      # design, so a data race there is a governance bug, not a flake.
      - run: mise run test

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # garmd must never depend on devkit, which mints tokens.
      #
      # devkit can assert any identity — any clearance, any compartment, any
      # delegation chain. This daemon decides what an identity may DO. The two
      # in one dependency graph means something in a request path can reach a
      # minter, and the reciprocal of this check lives in devkit's own CI.
      - name: no dependency on the token minter
        run: |
          if go list -deps ./... 2>/dev/null | grep -E 'garm-ai/devkit'; then
            echo "garmd depends on devkit, which mints identities" >&2
            exit 1
          fi
          echo "ok: garmd cannot reach a token minter"

      # garmd must never build-depend on a repository that implements tools.
      # A catalogue crosses that line as DATA, loaded at boot — never as an
      # import. This is the inversion the whole architecture buys: garmd's
      # build sees no tool protos at all.
      - name: no dependency on any tool repository
        run: |
          if go list -deps ./... 2>/dev/null | grep -E 'garm-ai/(examples|tools|agent)'; then
            echo "::error::garmd build-depends on a tool repository; a catalogue is data, not an import" >&2
            exit 1
          fi
          echo "clean: garmd depends on no tool repository"

      # The embedded NATS server is a TEST dependency and must stay one.
      #
      # It is in go.mod because the transport and stream tests run against a
      # real broker rather than a mock. `go list -deps ./...` excludes test
      # imports, so the day a non-test file imports it this check fails —
      # which is the point: a daemon that can start a broker is a daemon that
      # will, on someone's laptop, in production.
      #
      # Storage clients are named here for the same reason. A durable audit
      # store belongs behind a forwarder reading the stream, not inside the
      # process deciding what a caller may do.
      - name: the broker and the storage clients stay out of the build
        run: |
          if go list -deps ./... 2>/dev/null | grep -E 'nats-server|go-duckdb|minio-go'; then
            echo "::error::garmd build-depends on an embedded broker or a storage client" >&2
            exit 1
          fi
          echo "clean: the embedded server is test-only and no storage client is linked"

      # The tool-side runtime is what a tool service imports. A daemon
      # importing it would have the dependency backwards, and would drag the
      # enforcing side into a consumer's graph the first time anyone reused
      # a type.
      - name: no dependency on the tool runtime
        run: |
          if go list -deps ./... 2>/dev/null | grep -E 'garm-ai/tool-(go|python)'; then
            echo "::error::garmd depends on the tool-side runtime; that inverts the boundary" >&2
            exit 1
          fi
          echo "clean: garmd depends on no tool runtime"

  conformance:
    name: identity conformance (devkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: garmd

      # Cloned, never required. A `require` line pointing at a token minter
      # is exactly what the boundary the `boundaries` job asserts exists to
      # make visible.
      - uses: actions/checkout@v5
        with:
          repository: garm-ai/devkit
          path: devkit

      # spec's default branch, on purpose — pinning this to a feature branch
      # would ship a workflow that has to be edited again before merge.
      # conformance/identity/devkit.json currently lives only on spec's
      # feat/identity-foundations branch, so this job stays red until BOTH
      # that branch and garmd's feat/identity-foundations land on their
      # respective default branches. That first red run is expected, not a
      # regression.
      - uses: actions/checkout@v5
        with:
          repository: garm-ai/spec
          path: spec

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
          working_directory: garmd

      - name: start the dev IdP
        working-directory: devkit
        run: |
          go run ./cmd/garmdev idp \
            --personas examples/personas.yaml \
            --audience garm &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7450/.well-known/jwks.json >/dev/null && exit 0
            sleep 1
          done
          echo "the dev IdP never came up" >&2
          exit 1

      - name: conformance
        working-directory: garmd
        run: |
          # go test's working directory is the PACKAGE directory
          # (garmd/internal/conformance), not the module root, so a relative
          # ../spec/... would resolve under garmd, not beside it. This path
          # must stay absolute, via $GITHUB_WORKSPACE, or it will fail on
          # its first run.
          go test -tags conformance ./internal/conformance/ -v \
            -suite "$GITHUB_WORKSPACE/spec/conformance/identity/devkit.json" \
            -idp http://127.0.0.1:7450

      - name: assert no dependency on a minter
        working-directory: garmd
        run: |
          deps=$(go list -deps -test ./...)
          if [ -z "$deps" ]; then
            echo "go list produced no dependency output at all; that is a broken check, not a clean one" >&2
            exit 1
          fi
          if echo "$deps" | grep -q 'garm-ai/devkit'; then
            echo "garmd has acquired a dependency on a token minter" >&2
            exit 1
          fi
