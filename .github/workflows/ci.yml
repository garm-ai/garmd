# CI for garmd.
#
# Two jobs. The first is the ordinary one. The second asserts the boundaries
# this repository exists to hold — and they are asserted rather than
# documented because a single careless import would end either one silently.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: mise run lint
      - run: mise run build
      # -race because the plan cache is shared across concurrent requests by
      # design, so a data race there is a governance bug, not a flake.
      - run: mise run test

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # garmd must never depend on a token minter — devkit or the STS.
      #
      # Either can assert any identity — any clearance, any compartment, any
      # delegation chain. This daemon decides what an identity may DO. The two
      # in one dependency graph means something in a request path can reach a
      # minter, and the reciprocal of this check lives in devkit's own CI.
      #
      # Both build configurations, with test imports, because a build tag
      # hides an import from `go list` completely. conformance_test.go is
      # //go:build conformance — the single file in this repository most
      # likely to reach for a minter, and since the conformance job now
      # drives the STS's own endpoints it is the file where an import would
      # be most tempting — and an untagged list does not see it at all:
      #
      #   go list -f '{{.XTestGoFiles}}' ./internal/conformance/
      #     [form_minter_test.go run_test.go suite_test.go]
      #   go list -tags conformance -f '{{.XTestGoFiles}}' ./internal/conformance/
      #     [conformance_test.go form_minter_test.go run_test.go suite_test.go]
      #
      # The constraint is "not in go.mod, not in a _test.go import, not
      # behind a build tag", so the check runs once per tag set.
      - name: no dependency on the token minter
        run: |
          for tags in "" "conformance"; do
            # The assignment on its own line is the real protection here: a
            # `go list` that fails inside an `if` condition is swallowed and
            # reads as a clean check, where under errexit a failing
            # assignment aborts the step. The empty-output guard below
            # covers the remaining case — a `go list` that succeeds but
            # prints nothing is broken, not clean.
            deps=$(go list -tags "$tags" -deps -test ./...)
            if [ -z "$deps" ]; then
              echo "::error::go list (tags=\"$tags\") produced no dependency output at all; that is a broken check, not a clean one" >&2
              exit 1
            fi
            if echo "$deps" | grep -qE 'garm-ai/(devkit|sts)'; then
              echo "::error::garmd has acquired a dependency on a token minter (tags=\"$tags\")" >&2
              exit 1
            fi
          done
          echo "ok: no minter in the dependency graph, untagged or under -tags conformance"

      # garmd must never build-depend on a repository that implements tools.
      # A catalogue crosses that line as DATA, loaded at boot — never as an
      # import. This is the inversion the whole architecture buys: garmd's
      # build sees no tool protos at all.
      - name: no dependency on any tool repository
        run: |
          if go list -deps ./... 2>/dev/null | grep -E 'garm-ai/(examples|tools|agent)'; then
            echo "::error::garmd build-depends on a tool repository; a catalogue is data, not an import" >&2
            exit 1
          fi
          echo "clean: garmd depends on no tool repository"

      # garmd does not know about agents. An agent's manifest is bytes it
      # carries unread (see internal/catalogue/agentblind_test.go). Since garm
      # v0.14 the agent contracts live in the garm module itself, so the
      # boundary above cannot see them; this one can, tests included.
      - name: no dependency on the agent contracts
        run: |
          if go list -deps -test ./... 2>/dev/null | grep -E 'garm-ai/garm/contracts/garm/agent'; then
            echo "::error::garmd reaches the agent contracts; it must stay agent-blind" >&2
            exit 1
          fi
          echo "clean: garmd is agent-blind"

      # The embedded NATS server is a TEST dependency and must stay one.
      #
      # It is in go.mod because the transport and stream tests run against a
      # real broker rather than a mock. `go list -deps ./...` excludes test
      # imports, so the day a non-test file imports it this check fails —
      # which is the point: a daemon that can start a broker is a daemon that
      # will, on someone's laptop, in production.
      #
      # Storage clients are named here because a durable audit store belongs
      # behind a forwarder reading the stream, not inside the process deciding
      # what a caller may do.
      #
      # The AWS S3 client is deliberately NOT in this list. It is in the build,
      # and for the one thing the reasoning above does not cover: reading the
      # catalogue. That is an artifact this process loads at boot and re-reads
      # on an ETag change, with GetObject and HeadObject and nothing else —
      # internal/catalogue/s3.go's S3API interface is two read methods wide, so
      # a change that gave garmd the ability to WRITE to an object store would
      # have to widen it in a diff someone reads.
      - name: the broker and the storage clients stay out of the build
        run: |
          if go list -deps ./... 2>/dev/null | grep -E 'nats-server|go-duckdb|minio-go'; then
            echo "::error::garmd build-depends on an embedded broker or a storage client" >&2
            exit 1
          fi
          echo "clean: the embedded server is test-only and no storage client is linked"

      # The tool-side runtime is what a tool service imports. A daemon
      # importing it would have the dependency backwards, and would drag the
      # enforcing side into a consumer's graph the first time anyone reused
      # a type.
      - name: no dependency on the tool runtime
        run: |
          if go list -deps ./... 2>/dev/null | grep -E 'garm-ai/tool-(go|python)'; then
            echo "::error::garmd depends on the tool-side runtime; that inverts the boundary" >&2
            exit 1
          fi
          echo "clean: garmd depends on no tool runtime"

  conformance:
    name: identity conformance (sts)
    runs-on: ubuntu-latest
    # Skipped on PRs from forks, and skipped deliberately. The `sts`
    # checkout below needs a secret; a fork PR is handed none, so the job
    # would run, substitute `github.token`, and fail the private checkout
    # with a permissions error that reads like a bug in the contributor's
    # change. A skipped job is honest about what was not checked. A
    # permanently red one on every outside PR teaches people to ignore red
    # CI, which costs more than this job is worth.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          path: garmd

      # Cloned, never required. A `require` line pointing at a token minter
      # is exactly what the boundary the `boundaries` job asserts exists to
      # make visible.
      - uses: actions/checkout@v5
        with:
          repository: garm-ai/devkit
          path: devkit

      # The service under test. Cloned and RUN, never required — the
      # boundaries job's "no dependency on a minter" check greps for
      # garm-ai/sts in `go list -deps -test` under both tag sets, so the
      # only edge between these two repositories is a TCP connection.
      #
      # sts is private, hence the token and hence the fork guard above. The
      # steps below read $GITHUB_WORKSPACE/sts/deploy/{claims,tuples}.yaml
      # and build ./cmd/sts from this checkout: the conformance suite is
      # pinned against the deployment fixtures sts actually ships, not
      # against a copy of them kept here.
      #
      # PINNED TO A TAG, on purpose. The endpoints this suite drives —
      # exchange 2's governed door, POST /approve — and the deploy fixtures
      # it reads (can_run tuples, the approve: config block) first shipped in
      # sts v0.3.0; an older sts refuses to start on the `approve:` block
      # below, because its LoadConfig reads with KnownFields(true). Bump the
      # tag deliberately when the suite grows a case that needs a newer sts:
      # a branch ref would make this job follow whatever lands there, which
      # is the opposite of what a drift check is for.
      - uses: actions/checkout@v5
        with:
          repository: garm-ai/sts
          ref: v0.3.0
          path: sts
          token: ${{ secrets.GARM_CI_TOKEN || github.token }}

      # The suite for this job lives in this repository at
      # internal/conformance/suites/sts.json, alongside devkit's. Both moved
      # here from the private `spec` repo: a public repository's CI cannot
      # reach a private one from a fork, so the drift check only ran for
      # maintainers. It now runs for everyone.
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
          working_directory: garmd

      - name: start the upstream IdP (devkit)
        working-directory: devkit
        run: |
          # Redirected to a file, and for the same reason the devkit
          # conformance job's own idp step gives: an unredirected background
          # child holds this step's log pipe open and the job hangs until
          # timeout instead of proceeding to the readiness poll below.
          #
          # No --personas: the STS's exchange requires a subject_token
          # carrying a `tenant` claim, and devkit's persona (?user=) form
          # never attaches one. FormMinter's upstream fetch instead drives
          # devkit's ad-hoc ?sub=&tenant= form, which does — see
          # form_minter.go's doc comment on UpstreamURL.
          go run ./cmd/garmdev idp \
            --addr 127.0.0.1:7450 \
            --audience garm-customer-idp > /tmp/devkit-idp.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7450/.well-known/jwks.json >/dev/null && exit 0
            sleep 1
          done
          echo "the upstream IdP never came up" >&2
          cat /tmp/devkit-idp.log >&2
          exit 1

      - name: generate the sts signing key and a conformance client keypair
        run: |
          openssl ecparam -name prime256v1 -genkey -noout -out /tmp/sts-sign-k1.pem
          openssl ecparam -name prime256v1 -genkey -noout -out /tmp/conformance-client.key
          openssl ec -in /tmp/conformance-client.key -pubout -out /tmp/conformance-client.pub.pem 2>/dev/null

      - name: write an sts config trusting devkit
        run: |
          # $GITHUB_WORKSPACE, not a relative path: this file is read by a
          # process started from an arbitrary CWD below, and deploy/claims.yaml
          # / deploy/tuples.yaml must resolve regardless of it — the same
          # "absolute, never relative" rule the conformance step further down
          # applies to -suite.
          cat > /tmp/sts-config.yaml <<EOF
          issuer: https://sts.internal.example.com
          audience: garm://garmd
          listen: 127.0.0.1:8081
          tokenEndpointAudience: https://sts.internal.example.com/token
          delegationTTL: 10m
          keys:
            active: k1
            keys:
              - kid: k1
                pem: \$STS_SIGN_KEY_K1
          issuers:
            # kind: employee, not customer. The approval endpoint refuses a
            # non-employee approver by design (approval-grants §4, frame
            # 12), the STS resolves kind from the ISSUER's configuration,
            # and devkit serves one fixed \`iss\` — so one issuer entry can
            # only ever have one kind, and the grant case needs it to be
            # this one. The customer-side behaviour it displaced (the
            # instanceAuthorization clearance cap) is pinned by sts's own
            # TestInstanceAuthorizationAbsentRefusesCustomerTokens.
            - name: devkit-employee
              iss: https://garmdev.invalid/idp
              jwks: http://127.0.0.1:7450/.well-known/jwks.json
              audience: [garm-customer-idp]
              kind: employee
          clients:
            - id: conformance-client
              keys:
                - /tmp/conformance-client.pub.pem
          policy: $GITHUB_WORKSPACE/sts/deploy/claims.yaml
          authz:
            static: $GITHUB_WORKSPACE/sts/deploy/tuples.yaml
          instanceAuthorization:
            status: absent
            unconfinedCeiling: PUBLIC
          # POST /approve's grant lifetime. The suite's grant case declares
          # a tool with max_grant_age_seconds 900, and the tool's own
          # ceiling is the one that binds — this is only the floor.
          approve:
            ttl_seconds: 900
          EOF
          cat /tmp/sts-config.yaml

      - name: start the sts
        working-directory: sts
        run: |
          export STS_SIGN_KEY_K1="$(cat /tmp/sts-sign-k1.pem)"
          go build -o /tmp/sts-bin ./cmd/sts
          # Same redirect-to-a-file requirement as the upstream IdP step
          # above, for the same reason.
          /tmp/sts-bin -config /tmp/sts-config.yaml > /tmp/sts.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8081/.well-known/jwks.json >/dev/null && exit 0
            sleep 1
          done
          echo "the sts never came up" >&2
          cat /tmp/sts.log >&2
          exit 1

      - name: conformance
        working-directory: garmd
        run: |
          # Absolute, via $GITHUB_WORKSPACE, for the same reason the devkit
          # conformance job's own -suite path is: go test's working directory
          # is the PACKAGE directory, not the module root, so a relative
          # Relative to internal/conformance/: `go test` sets the test
          # binary's cwd to the package directory.
          go test -tags conformance ./internal/conformance/ -v \
            -suite suites/sts.json \
            -idp http://127.0.0.1:8081 \
            -minter form \
            -client-id conformance-client \
            -client-key /tmp/conformance-client.key \
            -token-endpoint-aud https://sts.internal.example.com/token \
            -upstream-idp http://127.0.0.1:7450

      - name: dump service logs on failure
        if: failure()
        run: |
          echo "::group::devkit"; cat /tmp/devkit-idp.log 2>/dev/null; echo "::endgroup::"
          echo "::group::sts"; cat /tmp/sts.log 2>/dev/null; echo "::endgroup::"
